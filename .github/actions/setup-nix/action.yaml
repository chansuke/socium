name: Setup Nix
description: Install Nix
inputs:
  cachix-auth-token:
    description: Cachix authentication token
    required: false
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix (numtide)
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: numtide
        authToken: ''

    # The public cache holds what nixpkgs does not, such as the pinned
    # bubblewrap and adrs, so every run reads it. Only runs given a token
    # (pushes to main) upload what they build.
    - name: Setup Cachix (chansuke)
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: chansuke
        authToken: ${{ inputs.cachix-auth-token }}
    - name: Load Nix development environment
      shell: bash
      run: nix develop --command true
