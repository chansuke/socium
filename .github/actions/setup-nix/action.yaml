name: Setup Nix
description: Install Nix
inputs:
  cachix-auth-token:
    description: Cachix authentication token
    required: false
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix (numtide)
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: numtide
        authToken: ''

    - name: Setup Cachix (chansuke)
      if: inputs.cachix-auth-token != ''
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: chansuke
        authToken: ${{ inputs.cachix-auth-token }}
    - name: Load Nix development environment
      shell: bash
      run: nix develop --command true
