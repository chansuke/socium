name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Format, Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Incremental data only helps local rebuilds and bloats the cache.
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # Compiled dependencies for Clippy and the tests. Pushes to main save
      # them; pull requests only restore, so they do not fill the cache.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Permit sandbox backend user namespaces
        uses: ./.github/actions/permit-sandbox-backend

      - name: Verify formatting
        uses: ./.github/actions/run-fmt

      - name: Run Clippy
        uses: ./.github/actions/run-clippy

      - name: Run tests
        uses: ./.github/actions/run-test

      - name: Check the evaluation with a mock model
        run: nix develop --command bash -c 'cargo build && python3 -m unittest evals/test_evals.py'

      - name: Save cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Build Nix package
        run: nix build .#default

      # The package's own PATH, not the dev shell's, must carry git and rg.
      - name: Run the package's git and ripgrep tools from an empty PATH
        run: |
          sandbox_backend=$(readlink -f "$(nix develop --command sh -c 'command -v bwrap')")
          python3 -I nix/package_smoke.py result/bin/socium "$sandbox_backend"

      - name: Remove CI sandbox backend profile
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/socium-ci-bwrap.apparmor" ]]; then
            sudo apparmor_parser -R "$RUNNER_TEMP/socium-ci-bwrap.apparmor"
          fi
