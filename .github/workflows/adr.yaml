name: ADR
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check ADRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Check ADRs
        run: nix run .#adrs -- doctor

      - name: Check that the ADR index is up to date
        run: nix run .#adrs -- generate toc | diff - docs/adr/README.md
