name: Feature request
description: Something socium should do that it does not.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. Note anything that would widen the sandbox or skip an approval; see docs/threat-model.md.
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you considered
