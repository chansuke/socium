# Line endings: only the changed line may differ, and it keeps CRLF.
category = "existing-change"
prompt = "In settings.ini, change the timeout from 30 to 60. Leave everything else unchanged."
check = ["python3", "-c", "import sys; sys.exit(0 if open('settings.ini','rb').read() == b'[server]\\r\\nhost = example.org\\r\\ntimeout = 60\\r\\nretries = 3\\r\\n' else 1)"]
allowed_changes = ["settings.ini"]
