[package]
name = "socium-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/chansuke/socium"
description = "Core runtime for the Socium coding agent"
publish = false

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "sync", "rt"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "test-util"] }

[lints]
workspace = true
