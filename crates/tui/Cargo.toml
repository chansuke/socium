[package]
name = "socium-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/chansuke/socium"
description = "Terminal interface for the Socium coding agent"
publish = false

[[bin]]
name = "socium"
path = "src/main.rs"

[dependencies]
socium-core = { path = "../core" }
ratatui = "0.30.0"
color-eyre = "0.6.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
unicode-segmentation = "1.13.0"
unicode-width = "0.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
