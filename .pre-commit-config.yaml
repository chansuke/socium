default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --all-features
        language: system
        pass_filenames: false

      - id: escape-hatches
        name: escape hatches in added lines
        entry: scripts/check-escape-hatches.sh --staged
        language: system
        pass_filenames: false

      - id: commit-metadata
        name: commit metadata
        entry: scripts/check-commit-metadata.sh --message
        language: system
        stages: [commit-msg]
